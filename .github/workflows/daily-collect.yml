name: Daily Glossary Collection

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source:
          - mesh
          - wikidata
          - icd10
          - hcpcs
          - rxnorm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect from ${{ matrix.source }}
        run: python -m collectors.${{ matrix.source }}_run

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.source }}-error-logs
          path: data/logs/

  collect-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: collect
    strategy:
      fail-fast: false
      matrix:
        source: [icd11, loinc, umls, snomed]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect from ${{ matrix.source }}
        # secrets are only available in step-level env — each collector reads
        # the variables it needs from this shared environment
        env:
          ICD11_CLIENT_ID: ${{ secrets.ICD11_CLIENT_ID }}
          ICD11_CLIENT_SECRET: ${{ secrets.ICD11_CLIENT_SECRET }}
          LOINC_USERNAME: ${{ secrets.LOINC_USERNAME }}
          LOINC_PASSWORD: ${{ secrets.LOINC_PASSWORD }}
          UMLS_API_KEY: ${{ secrets.UMLS_API_KEY }}
        run: python -m collectors.${{ matrix.source }}_run

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.source }}-error-logs
          path: data/logs/

  collect-file-based:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: collect
    strategy:
      fail-fast: false
      matrix:
        source: [atc, ichi, icf, custom_glossaries]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect from ${{ matrix.source }}
        run: python -m collectors.${{ matrix.source }}_run

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.source }}-error-logs
          path: data/logs/

  collect-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: collect

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — skip when Telegram secrets are absent
        id: guard
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
        run: |
          if [ -z "${TELEGRAM_API_ID:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Restore Telegram session
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        # ثلاث مشكلات في الصيغة السابقة:
        #   1) `${{ secrets.* }}` داخل run يُحقن نصيًّا قبل تنفيذ الصدفة —
        #      قاعدة 64 طويلة أو أي حرف خاص تكسر السكربت أو تتيح حقن أوامر.
        #   2) `2>/dev/null || true` يُخفي فشل فك الترميز، فيظهر لاحقًا كعطب
        #      مصادقة غامض بدل خطأ واضح.
        #   3) لا تحقق من أن الملف الناتج غير فارغ، ولا تنظيف له.
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_SESSION_B64:-}" ]; then
            echo "::error::TELEGRAM_SESSION_B64 is empty — cannot restore the session"
            exit 1
          fi
          umask 077
          # printf (لا echo) حتى لا تُضاف سطرًا جديدًا يفسد base64
          printf '%s' "$TELEGRAM_SESSION_B64" | base64 -d > glossary_session.session
          if [ ! -s glossary_session.session ]; then
            echo "::error::decoded session file is empty — is TELEGRAM_SESSION_B64 valid base64?"
            exit 1
          fi
          chmod 600 glossary_session.session
          echo "session restored ($(wc -c < glossary_session.session) bytes)"

      - name: Remove Telegram session file
        if: always()
        run: |
          if [ -f glossary_session.session ]; then
            shred -u glossary_session.session 2>/dev/null || rm -f glossary_session.session
            echo "session file removed"
          fi

      - name: Collect from Telegram
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python -m collectors.telegram_run

  merge-and-push:
    runs-on: ubuntu-latest
    needs: [collect, collect-auth, collect-file-based]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Merge all sources
        run: python -m processors.merge_sources

      - name: Commit and push
        run: |
          git config user.name "Glossary Bot"
          git config user.email "bot@example.com"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 تحديث المسارد - $(date +'%Y-%m-%d %H:%M UTC')"
          git push